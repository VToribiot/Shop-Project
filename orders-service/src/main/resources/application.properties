# HTTP / HTTPS
quarkus.http.port=8083
quarkus.http.ssl-port=8445
quarkus.http.insecure-requests=disabled
# Mutual TLS
quarkus.http.ssl.client-auth=required
quarkus.http.ssl.certificate.files=C:/certs/shop/server.crt
quarkus.http.ssl.certificate.key-files=C:/certs/shop/server.key
quarkus.http.ssl.certificate.trust-store-files=C:/certs/shop/ca.crt
# MongoDB
quarkus.mongodb.connection-string=mongodb://localhost:27017/?replicaSet=rs0
quarkus.mongodb.database=orders_db
# Kafka
kafka.bootstrap.servers=localhost:9092
# JWT Authentication
mp.jwt.verify.publickey.location=publicKey.pem
mp.jwt.verify.issuer=https://auth.example.com
mp.jwt.verify.audiences=shop-api
# Product Events
mp.messaging.incoming.product-events-in.connector=smallrye-kafka
mp.messaging.incoming.product-events-in.topic=product.events
mp.messaging.incoming.product-events-in.group.id=orders-service
mp.messaging.incoming.product-events-in.auto.offset.reset=earliest
mp.messaging.incoming.product-events-in.key.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming.product-events-in.value.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming.product-events-in.failure-strategy=dead-letter-queue
mp.messaging.incoming.product-events-in.dead-letter-queue.topic=product.events.dlq
# Inventory Events
mp.messaging.incoming.inventory-events-in.connector=smallrye-kafka
mp.messaging.incoming.inventory-events-in.topic=inventory.events
mp.messaging.incoming.inventory-events-in.group.id=orders-service
mp.messaging.incoming.inventory-events-in.auto.offset.reset=earliest
mp.messaging.incoming.inventory-events-in.key.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming.inventory-events-in.value.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming.inventory-events-in.failure-strategy=dead-letter-queue
mp.messaging.incoming.inventory-events-in.dead-letter-queue.topic=inventory.events.dlq