quarkus.http.port=8081
quarkus.mongodb.connection-string=mongodb://localhost:27017/?replicaSet=rs0
quarkus.mongodb.database=auth_db
smallrye.jwt.sign.key.location=privateKey.pem
app.jwt.issuer=https://auth.example.com
app.jwt.audience=shop-api
app.jwt.key-id=auth-key-1
app.jwt.access-ttl=15m
app.jwt.refresh-ttl=7d
# Brute-force protection
app.auth.max-failures=5
app.auth.lock-minutes=15
# Optional admin created on startup when both values are present (dev defaults below)
%dev.app.bootstrap.admin-email=admin@example.com
%dev.app.bootstrap.admin-password=Admin-pass-123
