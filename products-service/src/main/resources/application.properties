# HTTP / HTTPS
quarkus.http.port=8082
quarkus.http.ssl-port=8444
quarkus.http.insecure-requests=disabled
# Mutual TLS
quarkus.http.ssl.client-auth=required
quarkus.http.ssl.certificate.files=C:/certs/shop/server.crt
quarkus.http.ssl.certificate.key-files=C:/certs/shop/server.key
quarkus.http.ssl.certificate.trust-store-files=C:/certs/shop/ca.crt
# MongoDB
quarkus.mongodb.connection-string=mongodb://localhost:27017/?replicaSet=rs0
quarkus.mongodb.database=products_db
# Kafka
kafka.bootstrap.servers=localhost:9092
# JWT
mp.jwt.verify.publickey.location=publicKey.pem
mp.jwt.verify.issuer=https://auth.example.com
mp.jwt.verify.audiences=shop-api
# Order events
mp.messaging.incoming.order-events-in.connector=smallrye-kafka
mp.messaging.incoming.order-events-in.topic=order.events
mp.messaging.incoming.order-events-in.group.id=products-service
mp.messaging.incoming.order-events-in.auto.offset.reset=earliest
mp.messaging.incoming.order-events-in.key.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming.order-events-in.value.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming.order-events-in.failure-strategy=dead-letter-queue
mp.messaging.incoming.order-events-in.dead-letter-queue.topic=order.events.dlq
# Shared library indexing
quarkus.index-dependency.common.group-id=com.example
quarkus.index-dependency.common.artifact-id=shop-common